# ============================================================
# بوّابةُ جاهزيّةِ الإنتاج — فحصٌ إلزاميّ على طلبات الدمج إلى release/production
#
# ★ لماذا وُجدت
#
# كان الفرعُ المحميُّ `release/production` يشترط سياقًا باسم
# `production-readiness/gate`، ولا شيءَ في المستودع يُنتجه: السيران
# الوحيدان مجدولان و`workflow_dispatch` فقط. فبقي كلُّ طلبِ دمجٍ
# `blocked` إلى الأبد، و`enforce_admins` مفعّلة فلا يتجاوزه أحد.
#
# فالشرطُ كان قائمًا والفحصُ غائبًا — وهي أسوأُ الحالتين: يبدو المشروعُ
# محروسًا وليس فيه حارس، ثم يُغري الانسدادُ بتعطيل الحماية بدل بنائها.
#
# ★ اسمُ المهمّة هو السياق
#
# GitHub يشتقّ اسمَ الفحص من **اسم المهمّة** لا من اسم السير. فيجب أن يبقى
# `name:` أدناه مطابقًا حرفًا بحرف لما تشترطه حمايةُ الفرع. وتغييرُه يكسر
# البوّابةَ بصمت: يمرّ السيرُ أخضرَ ويظلّ الشرطُ غيرَ محقَّق.
#
# ★ pull_request لا pull_request_target
#
# البوّابةُ تُنفّذ شيفرةَ الطلب — بناءً واختبارات. و`pull_request_target`
# يعمل بسياق الفرع الأساس وبأسراره، فيسلّم أيَّ فاتحِ طلبٍ ما يملكه
# المستودع. وهذه البوّابةُ لا تحتاج سرًّا أصلًا: لا نشرَ ولا قاعدةَ بيانات
# ولا مزوّدَ مدفوع.
# ============================================================

name: production-readiness

on:
  pull_request:
    branches:
      - release/production
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# لا صلاحيةَ كتابةٍ البتّة: البوّابةُ تقرأ الشيفرةَ وتحكم، ولا تكتب حالةً
# ولا تعليقًا ولا نشرًا. وGitHub يُنشئ سجلَّ الفحص من تلقاء نفسه.
permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # ★ يجب أن يطابق سياقَ حماية الفرع حرفيًّا: production-readiness/gate
    name: production-readiness/gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR head (no credentials left behind)
        uses: actions/checkout@v4
        with:
          # وإلا بقي رمزُ الدفع في `.git/config` طوالَ تنفيذ شيفرةِ الطلب
          persist-credentials: false

      - name: Set up Node 22 (matches the production image)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ══════════════════════════════════════════════════════════
      # ثابتُ الإطفاء — يُقاس قبل البناء لا بعده
      #
      # ★ ولا تُضبط الرايةُ إلى "0" هنا.
      #
      # فضبطُها إلى صفر يجعل البوّابةَ تُثبت ما فرضته بنفسها، ويُخفي بيئةً
      # تصل مشتعلةً. والمطلوبُ أن تُبنى كما يُبنى الإنتاج: **غائبةً**.
      # ══════════════════════════════════════════════════════════
      # ★ يُقرأ متغيّرُ الصَّدفة لا سياقُ `env` في التعبيرات.
      #
      # فسياقُ `${{ env.X }}` لا يرى إلا ما أُعلن في السير نفسه أو كُتب في
      # `$GITHUB_ENV`؛ ومتغيّرٌ يحقنه المُشغِّلُ من خارج ذلك يخرج فارغًا،
      # فيصير الفحصُ يقيس ما كتبناه نحن ويمرّ دائمًا. و`$VAR` في الصَّدفة
      # هو ما سيراه `npm run build` فعلًا — وهو المقصود.
      - name: Assert the CI environment does not enable Local Image
        run: |
          if [ -n "${NEXT_PUBLIC_YSD_LOCAL_IMAGE:-}" ]; then
            echo "FAIL: NEXT_PUBLIC_YSD_LOCAL_IMAGE is present in the gate environment."
            echo "The production-default build must run with the variable absent, not set to 0."
            exit 1
          fi
          echo "OK: NEXT_PUBLIC_YSD_LOCAL_IMAGE is absent from the gate environment."

      # نفسُ الحُجّة للصوت، وخطوةٌ مستقلّة عمدًا: لو جُمعا في فحصٍ واحد
      # لقرأ السجلُّ سطرًا واحدًا لا يُميّز أيَّهما تسرّب.
      - name: Assert the CI environment does not enable Local Voice
        run: |
          if [ -n "${NEXT_PUBLIC_YSD_LOCAL_VOICE:-}" ]; then
            echo "FAIL: NEXT_PUBLIC_YSD_LOCAL_VOICE is present in the gate environment."
            echo "The production-default build must run with the variable absent, not set to 0."
            exit 1
          fi
          echo "OK: NEXT_PUBLIC_YSD_LOCAL_VOICE is absent from the gate environment."

      # والرايةُ الثالثة — صوتُ المتصفّح — خطوةٌ مستقلّةٌ للسبب نفسِه.
      # وخلفها منذ المرحلة 2 قراءةُ الرد بصوت المتصفّح؛ فغيابُها هنا هو ما
      # يُبقي تلك الميزةَ خارج بناء الإنتاج.
      #
      # ★ `${VAR+x}` لا `${VAR:-}` — المطلوبُ **الغيابُ** لا «الإطفاء».
      #
      # `:-` يُسوّي بين الغائب والمعرَّف بقيمةٍ فارغة، فيمرّ `VAR=""` ويُطبع
      # «absent» والمتغيّرُ حاضر. و`+x` يتمدّد إلى `x` متى عُرِّف المتغيّرُ ولو
      # بلا قيمة، وإلى لا شيء إن لم يُعرَّف أصلًا — فلا يمرّ إلا غيابٌ حقيقيّ.
      # ويُنفَّذ هذا النصُّ بعينه في tests/v149-browser-voice-flag.test.ts.
      - name: Assert the CI environment does not enable Browser Voice
        run: |
          if [ -n "${NEXT_PUBLIC_YSD_BROWSER_VOICE+x}" ]; then
            echo "FAIL: NEXT_PUBLIC_YSD_BROWSER_VOICE is present in the gate environment."
            echo "The production-default build must run with the variable absent, not set to 0 and not set to an empty value."
            exit 1
          fi
          echo "OK: NEXT_PUBLIC_YSD_BROWSER_VOICE is absent from the gate environment."

      - name: Assert no checked-in env file enables a local feature
        run: |
          # الملفّاتُ المتتبَّعة وحدها — ولا تُطبع قيمةُ أيّ متغيّر،
          # فاسمُ الملفّ واسمُ المتغيّر يكفيان للإصلاح.
          hits=$(git ls-files -z \
            | tr '\0' '\n' \
            | grep -E '(^|/)\.env|env\..*example' || true)
          bad=0
          for f in $hits; do
            for v in NEXT_PUBLIC_YSD_LOCAL_IMAGE NEXT_PUBLIC_YSD_LOCAL_VOICE NEXT_PUBLIC_YSD_BROWSER_VOICE; do
              if grep -qE "^[[:space:]]*${v}[[:space:]]*=" "$f"; then
                echo "FAIL: $f sets $v"
                bad=1
              fi
            done
          done
          [ "$bad" = "0" ] && echo "OK: no tracked env file sets a local-feature or browser-voice flag."
          exit $bad

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # مجموعةُ الاختبارات كلُّها. وحارسُ الشبكة في
      # tests/setup/no-external-network.ts يمنع أيَّ اتصالٍ خارج الحلقة
      # المحلّية، فلا مزوّدَ مدفوعًا يُستدعى من هنا ولو بالخطأ.
      - name: Full automated test suite
        run: npm test

      - name: Production-default build (flag absent)
        run: npm run build

      # يبني مرّتين — غائبةً ومشتعلة — ثم **يُنفّذ** البوّابةَ المشحونة في
      # كلّ حزمة. ولا يُقبل «لم أجد تعبيرًا» دليلًا على الحذف.
      - name: Local Image artifact verifier (executes the shipped gate)
        run: node scripts/verify-local-image-flag.mjs

      # يترك المُتحقِّقُ `.next` على بناء الإطفاء، فيُعاد الحكمُ هنا صراحةً
      # كي يذكر سجلُّ البوّابة نتيجةَ سياسةِ المحتوى بلا اجتهاد من القارئ.
      - name: Assert OFF artifact keeps the loopback origin out of CSP
        run: |
          node --input-type=module <<'NODE'
          import { extractGates, assessOff } from "./scripts/verify-local-image-flag.mjs";

          const client = extractGates([".next/static/chunks"]);
          const server = extractGates([".next/server"]);
          const c = assessOff(client, true);
          const s = assessOff(server, false);

          console.log(`client gates: ${client.length} -> ${c.verdict} (${c.reason})`);
          console.log(`server gates: ${server.length} -> ${s.verdict} (${s.reason})`);

          const okv = (v) => v === "inert" || v === "absent";
          if (!okv(c.verdict) || !okv(s.verdict)) {
            console.error("FAIL: a shipped gate is reachable in the production-default build.");
            process.exit(1);
          }
          // البوّابةُ كاذبة، فالفرعُ الذي يُضيف 127.0.0.1:47615 إلى
          // connect-src لا يُسلك. ولا يُدّعى أنّ الشيفرةَ حُذفت من الحزمة —
          // بل أنّها لا تُبلَغ.
          console.log("OK: server gate false => connect-src cannot gain the loopback origin.");
          NODE

      - name: Local Image targeted tests
        run: >-
          npx vitest run
          tests/v133-local-image-csp.test.ts
          tests/v133-local-image-dockerfile.test.ts
          tests/v133-local-image-failures.test.ts
          tests/v133-local-image-intent.test.ts
          tests/v133-local-image-retry.test.ts
          tests/v133-flagproof-env-safety.test.ts
          tests/v133-flagproof-gate-semantics.test.ts
          tests/v133-local-image-off.test.tsx
          tests/v133-local-image-panel.test.tsx
          tests/v133-local-image-routing.test.tsx

      # ── الصوتُ المحلّيّ: خطواتٌ مسمّاةٌ لا اعتمادًا على أنّ `npm test` يشملها ──
      #
      # اشتمالُ المجموعة الكاملة عليها صحيحٌ اليوم، لكنّه مصادفةٌ لا حراسة:
      # لو قُسّمت المجموعةُ أو رُشِّحت يومًا لسقطت التغطيةُ صامتة. وسجلُّ
      # GitHub يجب أن يقول صراحةً إنّ الصوتَ فُحص.
      - name: Local Voice artifact verifier (executes the shipped gate)
        run: node scripts/verify-local-voice-flag.mjs

      - name: Local Voice targeted tests
        run: >-
          npx vitest run
          tests/v134-local-voice-flag.test.ts
          tests/v134-local-voice-client.test.ts
          tests/v134-local-voice-ui.test.tsx
          tests/v134-local-voice-wire.test.ts
          tests/v136-engine-token-shared.test.tsx

      - name: Permissions-Policy targeted tests
        run: >-
          npx vitest run
          tests/v135-permissions-policy.test.ts

      # ── صوتُ المتصفّح: الرايةُ وتهيئتُها الأمنيّة ──
      #
      # يُثبت أنّ الرايةَ لا تشتعل إلا بـ`1` حرفيًّا، وأنّ الترويسات بغيابها
      # هي نفسُها حرفًا بحرف، وأنّ سياسةَ المحتوى لا تعرفها أصلًا.
      - name: Browser Voice flag tests
        run: >-
          npx vitest run
          tests/v149-browser-voice-flag.test.ts

      # ── صوتُ المتصفّح (المرحلة 2): قراءةُ الرد بضغطة ──
      #
      # مطفأةً: صفُّ أزرار الرد حرفًا بحرف ولا لمسةَ لواجهة الصوت. ومشتعلةً:
      # لا قراءةَ بلا ضغطة، وجلسةٌ واحدة، وأحداثُ الجلسة الملغاة لا تُطفئ
      # التي تليها، والتنقّلُ وإعادةُ التوليد يُسكتان القراءة.
      - name: Browser Voice read-aloud tests
        run: >-
          npx vitest run
          tests/v150-browser-voice-speech-text.test.ts
          tests/v150-browser-voice-read-aloud.test.ts
          tests/v150-browser-voice-ssr.test.ts
          tests/v150-browser-voice-ui.test.tsx
          tests/v150-browser-voice-off.test.tsx

      - name: Browser Assistant tests
        run: >-
          npx vitest run
          tests/browser-api-security.test.ts
          tests/browser-failure-contract.test.ts
          tests/browser-production-readiness.test.ts
          tests/browser-pilot-allowlist.test.ts
          tests/browser-privacy-logging.test.ts
          tests/v126-device-rate-limit.test.ts

      - name: Gate summary
        run: |
          {
            echo "### production-readiness/gate"
            echo ""
            echo "- lint, typecheck, full test suite: passed"
            echo "- production-default build ran with all three feature flags **absent** (Local Image, Local Voice, Browser Voice)"
            echo ""
            echo "**Local Image**"
            echo "- OFF shipped gate executes to \`false\` (client and server)"
            echo "- ON shipped gate executes to \`true\`"
            echo ""
            echo "**Local Voice**"
            echo "- OFF shipped gate executes to \`false\` (client and server)"
            echo "- ON shipped gate executes to \`true\`"
            echo "- production-default Permissions-Policy: \`camera=(), microphone=(), geolocation=()\` — microphone blocked"
            echo "- voice-enabled artifact: \`camera=(), microphone=(self), geolocation=()\` — self only, never a wildcard"
            echo ""
            echo "Feature code may remain in the OFF bundle; the asserted invariant is unreachability, not absence."
            echo ""
            echo "> Local Voice remains OFF unless \`NEXT_PUBLIC_YSD_LOCAL_VOICE\` is literal \`1\` at build time."
            echo "> This gate does not enable it anywhere, and Production must not set it —"
            echo "> see \`docs/local-voice-engine-contract.md\` (PRODUCTION ENABLEMENT BLOCKER)."
            echo ""
            echo "**Browser Voice (flag + read-aloud behind it)**"
            echo "- \`NEXT_PUBLIC_YSD_BROWSER_VOICE\` absent from the gate environment and from every tracked env file"
            echo "- behind the flag: per-reply read-aloud with the browser's own speech synthesis, started only by a click; no speech-to-text, no microphone code, no call from YSD code to a server or model provider; CSP unaffected"
            echo "- the browser's speech engine may itself use an online voice, in which case the reply text leaves the device; see \`docs/browser-voice.md\` before enabling the flag anywhere"
            echo "- with the flag absent: no read-aloud control is rendered, the browser speech API is never touched, and the production-default headers are byte-identical to before"
            echo "- the read-aloud code may remain in the OFF bundle; the asserted invariant is unreachability, not absence"
            echo ""
            echo "> Browser Voice remains OFF unless \`NEXT_PUBLIC_YSD_BROWSER_VOICE\` is literal \`1\` at build time."
            echo "> This gate does not enable it anywhere, and Production must not set it."
          } >> "$GITHUB_STEP_SUMMARY"
